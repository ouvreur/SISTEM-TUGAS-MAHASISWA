name: CI Sistem Tugas Mahasiswa

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testing:
    name: Pengujian Aplikasi
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode proyek
        uses: actions/checkout@v7

      - name: Menyiapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Menginstal dependency
        run: npm ci

      - name: Menjalankan pengujian
        run: npm test
